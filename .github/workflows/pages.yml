name: Validate and deploy to GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, codex/bunny-hop-trails]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test engine, movement and exports
        run: npm test
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp -r index.html styles.css src _site/
          # Keep each page's entire module/worker graph on one release. A soft
          # refresh must not combine new controls with cached old quiz code.
          asset_dir="_site/assets/${GITHUB_SHA}"
          mkdir -p "$asset_dir"
          cp -r styles.css src "$asset_dir/"
          sed -i "s|href=\"styles.css\"|href=\"assets/${GITHUB_SHA}/styles.css\"|;s|src=\"src/ui/app.js\"|src=\"assets/${GITHUB_SHA}/src/ui/app.js\"|" _site/index.html
          touch _site/.nojekyll
      - name: Test trail mode in Chromium
        env:
          CHECK_SITE: _site
          PRINT_PREVIEW: '1'
        run: node scripts/check-trail-browser.mjs browser-artifacts
      - name: Test existing grid controls in Chromium
        run: node scripts/check-grid-browser.mjs browser-artifacts
      - name: Test friend grid controls and exports in Chromium
        env:
          CHECK_SITE: _site
        run: node scripts/check-friend-grid-browser.mjs browser-artifacts
      - name: Test Conquest arrival in Chromium
        env:
          CHECK_SITE: _site
        run: node scripts/check-friend-conquest-browser.mjs browser-artifacts
      - name: Test weather and environment in Chromium
        env:
          CHECK_SITE: _site
        run: node scripts/check-environment-browser.mjs browser-artifacts
      - name: Test analog watch and sun direction in Chromium
        env:
          CHECK_SITE: _site
        run: node scripts/check-sun-watch-browser.mjs browser-artifacts
      - name: Test answer reasoning and automation JSON in Chromium
        env:
          CHECK_SITE: _site
        run: node scripts/check-explanation-browser.mjs browser-artifacts
      - name: Test world types in Chromium
        env:
          CHECK_SITE: _site
        run: node scripts/check-world-browser.mjs browser-artifacts
      - name: Test sniper mode in Chromium
        env:
          CHECK_SITE: _site
        run: node scripts/check-sniper-browser.mjs browser-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks
          path: browser-artifacts
          retention-days: 14
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published release
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const url = new URL(process.env.PAGE_URL);
          const release = process.env.RELEASE_SHA;
          async function read(path) {
            const response = await fetch(new URL(path, url), { signal: AbortSignal.timeout(15000) });
            assert.equal(response.status, 200, path);
            return response.text();
          }
          let html;
          for (let attempt = 0; attempt < 24; attempt++) {
            html = await read('?release=' + release);
            if (html.includes('assets/' + release + '/src/ui/app.js')) break;
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          assert.ok(html.includes('assets/' + release + '/src/ui/app.js'), 'Pages serves the current release');
          assert.ok(html.includes('id="trail-answer"'), 'Finish-cell control is published');
          const root = 'assets/' + release + '/src/';
          const [app, worker, quiz, grid, trails] = await Promise.all([
            read(root + 'ui/app.js'), read(root + 'ui/worker.js'), read(root + 'engine/quiz.js'),
            read(root + 'engine/trailGridQuiz.js'), read(root + 'engine/trailQuiz.js'),
          ]);
          assert.ok(app.includes('showTrailGridResult'));
          assert.ok(worker.includes('trailAnswer'));
          assert.ok(quiz.includes("import('./trailGridQuiz.js')"));
          assert.ok(grid.includes("label: 'FINISH'"));
          assert.ok(trails.includes('size * .25'));
          console.log('Published controls, worker and both trail generators verified at ' + url);
          JS
