<!doctype html>
<meta charset="utf-8">
<title>Easter egg models (dev)</title>
<body style="margin:0;background:#3f5a75">
<canvas id="c" width="1500" height="700"></canvas>
<script type="module">
  import { drawSleighTeam, drawReindeer } from '../src/easter/models/sleigh.js';
  let space = null;
  try { space = await import('../src/easter/models/space.js'); } catch (e) { /* not written yet */ }
  const ctx = document.getElementById('c').getContext('2d');
  const t = +(new URLSearchParams(location.search).get('t') || 0.3);
  const scale = +(new URLSearchParams(location.search).get('s') || 1.3);
  ctx.fillStyle = '#4a6482'; ctx.fillRect(0, 0, 1500, 700);
  drawSleighTeam(ctx, { x: 20, y: 130, scale: scale * 2.2, t });
  drawSleighTeam(ctx, { x: 20, y: 330, scale, t });
  if (space) space.drawGallery(ctx, { x: 20, y: 380, w: 1460, h: 300, t });
  window.done = true;
</script>
